name: Apollo CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build & Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build, Lint, and Test
      run: ./gradlew lintDebug testDebugUnitTest assembleDebug --parallel --build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: Apollo-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Create Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download APK from Build Job
        uses: actions/download-artifact@v8
        with:
          name: Apollo-Debug-APK
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-debug.apk
